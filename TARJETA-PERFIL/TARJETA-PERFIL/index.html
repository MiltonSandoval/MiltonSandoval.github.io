<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tarjeta de perfil de usuario - Ejercicio HTML y CSS"
    />
    <title>PROFILE_CARD.EXE</title>
    <!-- Pixel Art Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Tarjeta de perfil usando HTML5 semántico -->
    <article class="tarjeta-perfil">
      <!-- Imagen de perfil -->
      <img
        src="./img/mil.jpg"
        alt="Avatar pixelado de Milton Sandoval Monasterio"
        class="perfil-imagen"
      />

      <!-- Información del usuario -->
      <h1 class="perfil-nombre">MILTON.SYS</h1>
      <p class="perfil-titulo">DEV_FRONTEND.EXE</p>
      <p class="perfil-titulo">WEB_DESIGN_II.LOG</p>
      <p class="perfil-descripcion">
        Creando experiencias web pixel a pixel desde 2024. Especializado en HTML, CSS y JS.
      </p>

      <!-- Botón de acción -->
      <button class="btn-contactar">CONTACT.EXE</button>
    </article>
  <br>
  </body>
</html>
